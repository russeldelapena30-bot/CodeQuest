<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest - Authentication & DSA Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================================
       1. THEME VARIABLES & GLOBAL STYLING
       ======================================================== */
    :root {
      --bg: #12141c;
      --surface: #191d28;
      --surface-2: #212635;
      --border: #2c3244;
      --text: #eae7e0;
      --text-muted: #8f96a8;
      --amber: #f2a65a;
      --amber-hover: #d99148;
      --amber-dim: #4a3a26;
      --mint: #6fe3b4;
      --navbar-bg: rgba(15, 32, 67, 0.95);
    }

    [data-theme="light"] {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #edf2f7;
      --border: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      --amber: #d97706;
      --amber-hover: #b45309;
      --amber-dim: #fef3c7;
      --mint: #059669;
      --navbar-bg: rgba(30, 41, 59, 0.95);
    }

    * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); min-height: 100vh; margin: 0; padding: 0; color: var(--text); transition: background 0.3s, color 0.3s; }

    /* ========================================================
       2. RESPONSIVE NAVBAR
       ======================================================== */
    .navbar { background: var(--navbar-bg); padding: 10px 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); width: 100%; }
    .logo-container { display: flex; align-items: center; gap: 10px; color: white; flex-shrink: 0; text-decoration: none; cursor: pointer; }
    .nav-logo-img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    .logo-text { font-size: 1.35em; font-weight: 700; color: #ffffff; white-space: nowrap; letter-spacing: 0.5px; }

    .nav-tabs { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; overflow-x: auto; }
    .nav-btn { background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85em; white-space: nowrap; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--amber); border-color: var(--amber); color: #12141c; }
    
    .theme-toggle-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9em; white-space: nowrap; transition: all 0.2s; }
    .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .user-profile-badge { display: flex; align-items: center; gap: 8px; background: var(--surface-2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--text); font-size: 0.85em; white-space: nowrap; cursor: pointer; }
    .user-profile-badge:hover { border-color: var(--amber); }
    .logout-btn { background: #f2777a; color: white; font-size: 0.8em; padding: 4px 8px; border-radius: 4px; cursor: pointer; border: none; }
    .logout-btn:hover { background: #d65c5f; }

    .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
    .card { background: var(--surface); padding: 25px; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); margin-bottom: 20px; transition: background 0.3s, border-color 0.3s; }

    h2 { color: var(--amber); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1.35em; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 5px; font-size: 0.85em; color: var(--text-muted); }
    
    input, select, button { padding: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 6px; font-size: 1em; width: 100%; transition: background 0.3s, color 0.3s, border-color 0.3s; }
    input:focus, select:focus { border-color: var(--amber); outline: none; }
    
    /* ========================================================
       3. PASSWORD TOGGLE & OVERLAP PREVENTION
       ======================================================== */
    .pwd-wrapper { position: relative; display: block; width: 100%; }
    .pwd-wrapper input[type="password"],
    .pwd-wrapper input[type="text"] {
      width: 100% !important;
      padding-right: 52px !important;
    }
    .pwd-wrapper input::-ms-reveal,
    .pwd-wrapper input::-ms-clear { display: none; }
    .pwd-wrapper input::-webkit-credentials-auto-fill-button { visibility: hidden; pointer-events: none; position: absolute; right: 0; }

    .pwd-toggle-btn { position: absolute; right: 2px; top: 2px; bottom: 2px; width: 44px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; z-index: 5; }
    .pwd-toggle-btn:hover { color: var(--amber); background: transparent; }

    button { background-color: var(--amber); color: #12141c; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: var(--amber-hover); }

    .auth-toggle { margin-top: 15px; font-size: 0.9em; text-align: center; color: var(--text-muted); }
    .auth-toggle a { color: var(--amber); text-decoration: underline; cursor: pointer; }

    .message { padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none; font-weight: bold; font-size: 0.9em; }
    .success { background-color: var(--amber-dim); color: var(--mint); border: 1px solid var(--mint); }
    .error { background-color: #3a2325; color: #f2777a; border: 1px solid #f2777a; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; }
    table.admin-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    table.admin-table th, table.admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text); font-size: 0.9em; }
    table.admin-table th { background: var(--surface-2); color: var(--amber); }

    .score-pill { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 100px; padding: 5px 12px; }
    .score-pill b { color: var(--mint); }
    .array-cells { display: flex; gap: 6px; flex-wrap: wrap; }
    .cell { width: 40px; height: 40px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .cell.active { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); font-weight: bold; }

    /* ========================================================
       4. DSA TUTOR LAYOUT (Desktop Side-by-Side Grid)
       ======================================================== */
    .dsa-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
    aside.dsa-aside { display: flex; flex-direction: column; gap: 8px; }
    .node { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; color: var(--text); font-size: 0.95em; }
    .node:hover, .node.active { border-color: var(--amber); background: var(--surface-2); }
    
    main.dsa-main { padding: 0; }
    .lesson-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .lesson-block h3 { color: var(--amber); margin-top: 0; font-size: 1.15em; }
    
    .topic-image-container { margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); text-align: center; }
    .topic-image { width: 100%; max-height: 280px; object-fit: cover; display: block; }
    .image-caption { padding: 8px 12px; font-size: 0.85em; color: var(--text-muted); font-style: italic; background: var(--surface-2); }

    .next-topic-btn { background: var(--surface-2); color: var(--amber); border: 1px solid var(--amber); border-radius: 8px; padding: 12px 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; width: auto; }
    .next-topic-btn:hover { background: var(--amber); color: #12141c; }

    .quiz-option-label { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; cursor: pointer; color: var(--text); font-size: 0.95em; line-height: 1.4; }
    .quiz-option-label input { margin-top: 3px; width: auto; flex-shrink: 0; }
    .quiz-option-label:hover { border-color: var(--amber); }

    .quiz-nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; flex-wrap: wrap; }
    .quiz-progress-indicator { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; color: var(--text-muted); }

    /* ========================================================
       FEATURE STYLES: REWARD ANIMATION & PROFILE VIEW
       ======================================================== */
    .reward-badge-container { text-align: center; padding: 15px 0; }
    .reward-trophy { font-size: 3.5em; animation: bounce 1.2s infinite alternate; display: inline-block; }
    @keyframes bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-10px) scale(1.08); }
    }
    
    .profile-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
    .profile-info-box { background: var(--surface-2); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
    .profile-info-box label { display: block; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0

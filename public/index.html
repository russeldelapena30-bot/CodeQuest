<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest - Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    /* Login Box Styles */
    .login-container { max-width: 400px; margin: 80px auto; background-color: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
    .login-container h2 { color: #38bdf8; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background-color: #0f172a; color: white; }
    .btn-submit { width: 100%; padding: 10px; background-color: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background-color: #0369a1; }

    /* Admin Dashboard Styles */
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #38bdf8; margin: 0; font-size: 24px; }
    .btn-logout { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout:hover { background-color: #dc2626; }
    
    .btn-delete { background-color: #991b1b; color: #fca5a5; border: 1px solid #dc2626; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-delete:hover { background-color: #dc2626; color: white; }

    .stats-card { background-color: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; border: 1px solid #334155; }
    
    table { width: 100%; border-collapse: collapse; background-color: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background-color: #334155; color: #38bdf8; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
    tr:hover { background-color: #24334a; }
    
    .score-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; background-color: #0284c7; color: white; }
    .no-score { color: #94a3b8; font-style: italic; }
    .error-msg { background-color: #7f1d1d; color: #fca5a5; padding: 15px; border-radius: 6px; display: none; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- VIEW 1: LOGIN FORM -->
  <div id="login-view" class="login-container">
    <h2>CodeQuest Login</h2>
    <div id="login-error" class="error-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>
  </div>

  <!-- VIEW 2: ADMIN DASHBOARD -->
  <div id="admin-view" class="container" style="display: none;">
    <header>
      <h1>CodeQuest Admin Dashboard</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </header>

    <div id="error-box" class="error-msg"></div>

    <div class="stats-card">
      Total Records Found: <strong id="total-count" style="color: #38bdf8;">0</strong>
    </div>

    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Username</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Quiz Name</th>
          <th>Score</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <tr>
          <td colspan="7" style="text-align: center; color: #94a3b8;">Loading user records...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      const token = localStorage.getItem('token');
      if (token) {
        showAdminView();
        loadAdminDashboard();
      } else {
        showLoginView();
      }
    }

    // --- VIEW SWITCHING LOGIC ---
    function showLoginView() {
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('admin-view').style.display = 'none';
    }

    function showAdminView() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
    }

    // --- LOGIN FORM HANDLER ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;
      const errorMsg = document.getElementById('login-error');

      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store authentication credentials
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Switch to admin view and render data
        showAdminView();
        loadAdminDashboard();
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      }
    });

    // --- ADMIN DASHBOARD LOGIC ---
    async function loadAdminDashboard() {
      const token = localStorage.getItem('token');
      if (!token) {
        logout();
        return;
      }

      try {
        const response = await fetch('/api/admin/user-scores', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 401 || response.status === 403) {
          logout();
          return;
        }

        if (!response.ok) throw new Error('Failed to fetch user records.');

        const records = await response.json();
        renderTable(records);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderTable(records) {
      const tableBody = document.getElementById('users-table-body');
      document.getElementById('total-count').textContent = records.length;

      if (records.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center;">No user records found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = records.map(row => {
        const fullName = `${row.first_name || ''} ${row.last_name || ''}`;
        const quiz = row.quiz_name ? row.quiz_name : '<span class="no-score">No quiz taken</span>';
        const scoreDisplay = row.score !== null && row.score !== undefined 
          ? `<span class="score-badge">${row.score} / ${row.max_score}</span>` 
          : '<span class="no-score">N/A</span>';
        
        const deleteButton = row.username === 'admin' 
          ? '<span style="color: #64748b; font-size: 12px;">(Protected)</span>' 
          : `<button class="btn-delete" onclick="deleteUser(${row.user_id}, '${escapeHtml(row.username)}')">Delete</button>`;

        return `
          <tr>
            <td>#${row.user_id}</td>
            <td><strong>${escapeHtml(row.username)}</strong></td>
            <td>${escapeHtml(fullName)}</td>
            <td>${escapeHtml(row.email)}</td>
            <td>${quiz}</td>
            <td>${scoreDisplay}</td>
            <td>${deleteButton}</td>
          </tr>
        `;
      }).join('');
    }

    async function deleteUser(userId, username) {
      if (!confirm(`Are you sure you want to permanently delete user "${username}" and all associated quiz scores?`)) {
        return;
      }

      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`/api/admin/users/${userId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.error || 'Failed to delete user.');
          return;
        }

        alert(result.message);
        loadAdminDashboard();
      } catch (err) {
        alert('Server error during deletion.');
      }
    }

    function showError(message) {
      const errorBox = document.getElementById('error-box');
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    // --- FULLY FIXED LOGOUT ---
    function logout() {
      // 1. Wipe out local storage
      localStorage.clear();
      sessionStorage.clear();

      // 2. Clear input fields
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';

      // 3. Switch back to login screen immediately
      showLoginView();
    }

    function escapeHtml(str) {
      return str ? String(str).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]) : '';
    }
  </script>
</body>
</html>

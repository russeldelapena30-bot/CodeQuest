<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeQuest - Authentication & DSA Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background: #12141c; 
      min-height: 100vh;
      margin: 0; 
      padding: 0; 
      color: #eae7e0; 
    }

    .navbar {
      background: rgba(15, 32, 67, 0.95);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .logo-container { display: flex; align-items: center; gap: 12px; color: white; }
    .logo-icon {
      width: 38px; height: 38px; background: #f2a65a; color: #12141c;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.3em;
    }
    .logo-text { font-size: 1.6em; font-weight: 700; color: #ffffff; }

    .nav-tabs { display: flex; gap: 10px; align-items: center; }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15); color: white;
      border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: #f2a65a; border-color: #f2a65a; color: #12141c; }
    
    .user-profile-badge {
      display: flex; align-items: center; gap: 10px; background: #212635;
      padding: 6px 12px; border-radius: 20px; border: 1px solid #2c3244;
    }
    .logout-btn { background: #f2777a; color: white; font-size: 0.85em; padding: 6px 12px; }
    .logout-btn:hover { background: #d65c5f; }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    
    .card { 
      background: #191d28; padding: 25px; border: 1px solid #2c3244;
      border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); margin-bottom: 25px; 
    }

    h2 { color: #f2a65a; margin-top: 0; border-bottom: 1px solid #2c3244; padding-bottom: 10px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; color: #8f96a8; }
    
    input, select, button { padding: 10px; border: 1px solid #2c3244; background: #212635; color: #eae7e0; border-radius: 6px; font-size: 1em; }
    input:focus, select:focus { border-color: #f2a65a; outline: none; }
    
    button { background-color: #f2a65a; color: #12141c; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #d99148; }

    .auth-toggle { margin-top: 15px; font-size: 0.9em; text-align: center; color: #8f96a8; }
    .auth-toggle a { color: #f2a65a; text-decoration: underline; cursor: pointer; }

    .message { padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none; font-weight: bold; }
    .success { background-color: #20372f; color: #6fe3b4; border: 1px solid #6fe3b4; }
    .error { background-color: #3a2325; color: #f2777a; border: 1px solid #f2777a; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    /* DSA Tutor Styles */
    :root {
      --bg: #12141c; --surface: #191d28; --surface-2: #212635;
      --border: #2c3244; --text: #eae7e0; --text-muted: #8f96a8;
      --amber: #f2a65a; --amber-dim: #4a3a26; --mint: #6fe3b4;
      --mint-dim: #20372f; --coral: #f2777a; --slate: #3a4157;
    }
    .score-pill { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 100px; padding: 6px 14px; }
    .score-pill b { color: var(--mint); }
    .array-cells { display: flex; gap: 6px; flex-wrap: wrap; }
    .cell { position: relative; width: 44px; height: 44px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .cell.active { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); font-weight: bold; }

    .dsa-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
    aside.dsa-aside { padding: 10px 0; }
    .node { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; margin-bottom: 8px; text-align: left; color: var(--text); transition: all 0.2s; }
    .node:hover, .node.active { border-color: var(--amber); background: var(--surface-2); }
    main.dsa-main { padding: 10px 0; }
    .lesson-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .lesson-block h3 { color: #f2a65a; margin-top: 0; }
    
    .quiz-option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .quiz-option-label:hover { border-color: var(--amber); }
  </style>
</head>
<body>

<div class="navbar">
  <div class="logo-container">
    <div class="logo-icon">&lt;/&gt;</div>
    <div class="logo-text">CodeQuest</div>
  </div>
  
  <div class="nav-tabs" id="nav-container">
    <button class="nav-btn" onclick="switchTab('tutor')">DSA Tutor</button>
    <button class="nav-btn" onclick="switchTab('quiz')">DSA Quiz</button>
    <div id="user-badge-area"></div>
  </div>
</div>

<div class="container">
  <div id="alert-box" class="message"></div>

  <!-- AUTHENTICATION VIEW -->
  <div id="auth-view" class="view-section active">
    <div class="card" style="max-width: 480px; margin: 40px auto;">
      <h2 id="auth-title">Login to CodeQuest</h2>
      
      <!-- LOGIN FORM -->
      <form id="login-form">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Username</label>
          <input type="text" id="login-username" required>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" style="width: 100%;">Login</button>
        <div class="auth-toggle">
          Don't have an account? <a onclick="toggleAuthMode('register')">Register here</a>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" style="display: none;">
        <div class="form-grid">
          <div class="form-group">
            <label>Username *</label>
            <input type="text" id="reg-username" required>
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="reg-password" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="reg-email" required>
          </div>
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="reg-firstname" required>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="reg-lastname" required>
          </div>
          <div class="form-group">
            <label>Middle Initial</label>
            <input type="text" id="reg-mi" maxlength="1">
          </div>
        </div>
        <br>
        <button type="submit" style="width: 100%;">Create Account</button>
        <div class="auth-toggle">
          Already registered? <a onclick="toggleAuthMode('login')">Login here</a>
        </div>
      </form>
    </div>
  </div>

  <!-- TAB 1: DSA TUTOR -->
  <div id="tutor-view" class="view-section">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>Interactive DSA Lessons</h2>
        <div class="score-pill" id="scorePill"><b>8</b> Topics Available</div>
      </div>
      <div class="array-cells" id="arrayCells"></div>
    </div>

    <div class="dsa-layout">
      <aside class="dsa-aside">
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">LESSON PATH</div>
        <div id="chain"></div>
      </aside>
      <main class="dsa-main" id="mainContent"></main>
    </div>
  </div>

  <!-- TAB 2: DYNAMIC DSA QUIZ VIEW -->
  <div id="quiz-view" class="view-section">
    <div class="card">
      <h2>Playable DSA Topic Quiz</h2>
      <p>Select any topic, complete the quiz, and record your score directly to your database profile.</p>

      <div class="form-group" style="margin-bottom: 25px;">
        <label for="quiz-topic-select">Select Topic to Test:</label>
        <select id="quiz-topic-select" onchange="renderQuizQuestions(this.value)">
          <!-- Populated by JavaScript -->
        </select>
      </div>

      <form id="dsa-quiz-form">
        <div id="quiz-questions-container"></div>
        <br>
        <button type="submit" style="width: 100%; padding: 12px; font-size: 1.05em;">Submit Quiz & Save Score</button>
      </form>
    </div>
  </div>

</div>

<script>
  const API_URL = '/api';
  let currentUser = JSON.parse(localStorage.getItem('cq_user')) || null;
  let authToken = localStorage.getItem('cq_token') || null;
  let currentTopicIndex = 0;

  function updateNav() {
    const badgeArea = document.getElementById('user-badge-area');
    if (currentUser) {
      badgeArea.innerHTML = `
        <div class="user-profile-badge">
          <span><b>${currentUser.first_name}</b> (${currentUser.username})</span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      `;
    } else {
      badgeArea.innerHTML = `<button class="nav-btn active" onclick="switchTab('auth')">Login / Register</button>`;
    }
  }

  function switchTab(tabName) {
    if (!authToken && tabName !== 'auth') {
      showAlert('Please login or register first!', 'error');
      tabName = 'auth';
    }

    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(`${tabName}-view`).classList.add('active');
  }

  function toggleAuthMode(mode) {
    if (mode === 'register') {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
      document.getElementById('auth-title').innerText = 'Create New Account';
    } else {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('auth-title').innerText = 'Login to CodeQuest';
    }
  }

  function showAlert(msg, type = 'success') {
    const box = document.getElementById('alert-box');
    box.className = `message ${type}`;
    box.innerText = msg;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 4000);
  }

  // --- AUTHENTICATION HANDLERS ---

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      username: document.getElementById('reg-username').value,
      password: document.getElementById('reg-password').value,
      email: document.getElementById('reg-email').value,
      first_name: document.getElementById('reg-firstname').value,
      last_name: document.getElementById('reg-lastname').value,
      middle_initial: document.getElementById('reg-mi').value
    };

    const res = await fetch(`${API_URL}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      showAlert(data.message, 'success');
      toggleAuthMode('login');
    } else {
      showAlert(data.error || 'Registration failed', 'error');
    }
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      username: document.getElementById('login-username').value,
      password: document.getElementById('login-password').value
    };

    const res = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      authToken = data.token;
      currentUser = data.user;
      localStorage.setItem('cq_token', authToken);
      localStorage.setItem('cq_user', JSON.stringify(currentUser));
      updateNav();
      showAlert('Welcome back, ' + currentUser.first_name + '!', 'success');
      switchTab('tutor');
    } else {
      showAlert(data.error || 'Login failed', 'error');
    }
  });

  function logout() {
    authToken = null;
    currentUser = null;
    localStorage.removeItem('cq_token');
    localStorage.removeItem('cq_user');
    updateNav();
    showAlert('Logged out successfully.', 'success');
    switchTab('auth');
  }

  // 8 DSA TOPICS WITH TAILORED QUIZZES
  const TOPICS = [
    { 
      id: 'bigo', 
      title: 'Big-O Notation', 
      node: '01', 
      blurb: 'Describes how algorithmic performance scales with input size (N).', 
      lesson: [
        { h: 'Time Complexity', b: 'O(1) Constant, O(log N) Logarithmic, O(N) Linear, O(N²) Quadratic.' },
        { h: 'Space Complexity', b: 'Measures how much memory an algorithm requires relative to input size.' }
      ],
      quiz: [
        {
          q: "What is the time complexity of accessing an element in an array directly by index?",
          options: ["O(1)", "O(N)", "O(log N)", "O(N²)"],
          answer: 0
        },
        {
          q: "Which Big-O complexity represents quadratic growth (e.g., nested loops)?",
          options: ["O(N)", "O(N²)", "O(1)", "O(log N)"],
          answer: 1
        }
      ]
    },
    { 
      id: 'arrays', 
      title: 'Arrays & Strings', 
      node: '02', 
      blurb: 'Contiguous memory blocks enabling fast indexed access.', 
      lesson: [
        { h: 'Lookups', b: 'Direct pointer arithmetic allows instant O(1) index access.' },
        { h: 'Insertions & Deletions', b: 'Requires shifting elements, resulting in O(N) worst-case speed.' }
      ],
      quiz: [
        {
          q: "Why is inserting an element at the beginning of an array an O(N) operation?",
          options: ["Array size is fixed", "Existing elements must shift forward in memory", "Hash collision resolution", "Requires tree balancing"],
          answer: 1
        },
        {
          q: "How are contiguous array elements laid out in memory?",
          options: ["Randomly connected via pointers", "In sequential adjacent memory locations", "In a hierarchical tree structure", "In separate hash buckets"],
          answer: 1
        }
      ]
    },
    { 
      id: 'linkedlist', 
      title: 'Linked Lists', 
      node: '03', 
      blurb: 'Linear sequence of nodes linked via memory pointers.', 
      lesson: [
        { h: 'Singly vs Doubly Linked', b: 'Singly links next node; Doubly links both prev and next.' },
        { h: 'Efficiency', b: 'O(1) node insertion at known positions, O(N) linear search.' }
      ],
      quiz: [
        {
          q: "What addition does a Doubly Linked List node have compared to a Singly Linked List node?",
          options: ["Data payload", "Pointer to next node", "Pointer to previous node", "Root index pointer"],
          answer: 2
        },
        {
          q: "What is the worst-case time complexity for searching a value in an unsorted linked list?",
          options: ["O(1)", "O(log N)", "O(N)", "O(N²)"],
          answer: 2
        }
      ]
    },
    { 
      id: 'stacks', 
      title: 'Stacks (LIFO)', 
      node: '04', 
      blurb: 'Last-In, First-Out sequence used in call stacks & undo features.', 
      lesson: [
        { h: 'Core Operations', b: 'Push (insert top) and Pop (remove top) both operate in O(1) time.' }
      ],
      quiz: [
        {
          q: "Which access rule describes a Stack data structure?",
          options: ["First-In, First-Out (FIFO)", "Last-In, First-Out (LIFO)", "Random Access", "Sorted Access"],
          answer: 1
        },
        {
          q: "Which operation removes the top item from a stack?",
          options: ["Push", "Enqueue", "Pop", "Peek"],
          answer: 2
        }
      ]
    },
    { 
      id: 'queues', 
      title: 'Queues (FIFO)', 
      node: '05', 
      blurb: 'First-In, First-Out model used for task scheduling & buffers.', 
      lesson: [
        { h: 'Core Operations', b: 'Enqueue (add back) and Dequeue (remove front) run in O(1) time.' }
      ],
      quiz: [
        {
          q: "In a standard Queue, where are new items inserted?",
          options: ["Front", "Rear/Back", "Middle", "At a Random Index"],
          answer: 1
        },
        {
          q: "Which real-world analogy best describes a Queue?",
          options: ["A stack of plates", "A line of people waiting at a bank ticket counter", "A web browser back button", "A bookshelf"],
          answer: 1
        }
      ]
    },
    { 
      id: 'hashtables', 
      title: 'Hash Tables', 
      node: '06', 
      blurb: 'Key-value maps powered by a hash function for rapid retrieval.', 
      lesson: [
        { h: 'Performance', b: 'Offers O(1) average lookup, insertion, and deletion.' },
        { h: 'Collisions', b: 'Handled via Chaining (linked list buckets) or Open Addressing.' }
      ],
      quiz: [
        {
          q: "What is the average time complexity for key lookups in a Hash Table?",
          options: ["O(1)", "O(N)", "O(log N)", "O(N log N)"],
          answer: 0
        },
        {
          q: "What occurs when two distinct keys generate the exact same hash code?",
          options: ["Stack overflow", "Hash collision", "Memory leak", "Binary split"],
          answer: 1
        }
      ]
    },
    { 
      id: 'trees', 
      title: 'Binary Trees & BST', 
      node: '07', 
      blurb: 'Hierarchical node structures with left and right children.', 
      lesson: [
        { h: 'Binary Search Trees (BST)', b: 'Left child < Parent < Right child. Enables O(log N) average searches.' }
      ],
      quiz: [
        {
          q: "In a valid Binary Search Tree (BST), where are values smaller than the parent node placed?",
          options: ["Right child subtree", "Left child subtree", "At the root only", "Leaves only"],
          answer: 1
        },
        {
          q: "What is the average search time complexity in a balanced BST?",
          options: ["O(1)", "O(log N)", "O(N)", "O(N²)"],
          answer: 1
        }
      ]
    },
    { 
      id: 'graphs', 
      title: 'Graphs & Traversals', 
      node: '08', 
      blurb: 'Networks composed of Vertices (nodes) and Edges (connections).', 
      lesson: [
        { h: 'Traversals', b: 'BFS (Breadth-First using Queue) vs DFS (Depth-First using Stack).' }
      ],
      quiz: [
        {
          q: "Which helper data structure is typically used to implement Breadth-First Search (BFS)?",
          options: ["Stack", "Queue", "Binary Heap", "Hash Set"],
          answer: 1
        },
        {
          q: "What components make up a standard Graph?",
          options: ["Keys and Values", "Vertices (Nodes) and Edges (Links)", "Pointers and Offsets", "Rows and Columns"],
          answer: 1
        }
      ]
    }
  ];

  function renderTopic(index) {
    currentTopicIndex = index;
    const t = TOPICS[index];
    
    document.querySelectorAll('.cell').forEach((cell, i) => {
      cell.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.node').forEach((node, i) => {
      node.classList.toggle('active', i === index);
    });

    const lessonsHtml = t.lesson.map(l => `<div class="lesson-block"><h3>${l.h}</h3><p>${l.b}</p></div>`).join('');
    document.getElementById('mainContent').innerHTML = `
      <h2>${t.title}</h2>
      <p style="color: var(--text-muted); font-size: 1.05em; margin-bottom: 20px;">${t.blurb}</p>
      ${lessonsHtml}
    `;
  }

  function renderTutor() {
    document.getElementById('arrayCells').innerHTML = TOPICS.map((t, idx) => 
      `<div class="cell ${idx === 0 ? 'active' : ''}" onclick="renderTopic(${idx})">${t.node}</div>`
    ).join('');
    
    document.getElementById('chain').innerHTML = TOPICS.map((t, idx) => 
      `<button class="node ${idx === 0 ? 'active' : ''}" onclick="renderTopic(${idx})">${t.node}. ${t.title}</button>`
    ).join('');
    
    renderTopic(0);
  }

  // --- QUIZ FUNCTIONS ---

  function initQuizView() {
    const selectEl = document.getElementById('quiz-topic-select');
    selectEl.innerHTML = TOPICS.map((t, idx) => `<option value="${idx}">${t.node}. ${t.title}</option>`).join('');
    renderQuizQuestions(0);
  }

  function renderQuizQuestions(topicIndex) {
    const topic = TOPICS[topicIndex];
    const container = document.getElementById('quiz-questions-container');

    if (!topic.quiz || topic.quiz.length === 0) {
      container.innerHTML = '<p>No questions available for this topic yet.</p>';
      return;
    }

    container.innerHTML = topic.quiz.map((qObj, qIdx) => `
      <div style="margin-bottom: 25px; background: var(--surface); padding: 18px; border-radius: 8px; border: 1px solid var(--border);">
        <p style="margin-top:0; font-weight: 600; color: #f2a65a;">Question ${qIdx + 1}: ${qObj.q}</p>
        ${qObj.options.map((opt, optIdx) => `
          <label class="quiz-option-label">
            <input type="radio" name="q_${qIdx}" value="${optIdx}" required>
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
    `).join('');
  }

  document.getElementById('dsa-quiz-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const selectedTopicIdx = document.getElementById('quiz-topic-select').value;
    const topic = TOPICS[selectedTopicIdx];
    let calculatedScore = 0;
    const totalQuestions = topic.quiz.length;

    topic.quiz.forEach((qObj, qIdx) => {
      const selectedOpt = document.querySelector(`input[name="q_${qIdx}"]:checked`);
      if (selectedOpt && parseInt(selectedOpt.value) === qObj.answer) {
        calculatedScore++;
      }
    });

    const res = await fetch(`${API_URL}/scores`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      },
      body: JSON.stringify({ 
        quiz_name: `${topic.title} Quiz`, 
        score: calculatedScore, 
        max_score: totalQuestions 
      })
    });

    if (res.ok) {
      showAlert(`Quiz submitted! Score for ${topic.title}: ${calculatedScore}/${totalQuestions} saved.`, 'success');
    } else {
      showAlert('Failed to save score. Please verify you are logged in.', 'error');
    }
  });

  // Initialization
  updateNav();
  renderTutor();
  initQuizView();
  if (authToken) switchTab('tutor');
</script>
</body>
</html>
